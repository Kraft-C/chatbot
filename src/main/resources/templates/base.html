<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content, pageTitle)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#191317">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <title th:text="${pageTitle} ?: 'PAWLY'">PAWLY</title>

    <!-- Bootstrap local -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <!-- Bootstrap Icons local (le fichier CSS se trouve à la racine du dossier, les polices dans fonts/) -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.css}">
    <!-- Polices : Poppins, Inter et JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/pawly.css}">
</head>
<body>
<!-- Symbole SVG de la patte PAWLY : réutilisable avec <use href="#pawly-paw"> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="pawly-paw" viewBox="0 0 64 64">
        <ellipse cx="13" cy="31" rx="6.2" ry="8.2" transform="rotate(-18 13 31)"/>
        <ellipse cx="25" cy="16" rx="6.4" ry="9" transform="rotate(-6 25 16)"/>
        <ellipse cx="39" cy="16" rx="6.4" ry="9" transform="rotate(6 39 16)"/>
        <ellipse cx="51" cy="31" rx="6.2" ry="8.2" transform="rotate(18 51 31)"/>
        <path d="M32 29c-8.5 0-18 9.5-18 17.5 0 5.8 4.8 9 10 8 3-.6 5.3-1.7 8-1.7s5 1.1 8 1.7c5.2 1 10-2.2 10-8C50 38.5 40.5 29 32 29z"/>
    </symbol>
</svg>

<!-- th:replace est prioritaire sur th:if quand ils sont sur le même élément : d'où le th:block. -->
<th:block th:if="${showHeader == true}">
    <div th:replace="~{fragment/header :: header}"></div>
</th:block>

<main th:replace="${content}">
    <!-- Le contenu de chaque page est injecté ici par Thymeleaf. -->
</main>

<th:block th:if="${showHeader == true}">
    <div th:replace="~{fragment/footer :: footer}"></div>
</th:block>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/pawly.js}"></script>
</body>
</html>
